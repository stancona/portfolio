name: Regenerate Screenshots

on:
  repository_dispatch:
    types: [grimoire-dev-merged]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: stancona_ci_db
          POSTGRES_USER: stancona_ci_user
          POSTGRES_PASSWORD: stancona_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stancona_ci_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://stancona_ci_user:stancona_ci_password@localhost:5432/stancona_ci_db
      SESSION_SECRET: ci-only-session-secret-32-chars-minimum
      COOKIE_DOMAIN: .stancona.localhost
      AUTH_OTP_PEPPER: ci-only-otp-pepper-64-hex-chars-placeholder-value-0000000000
      ADMIN_EMAILS: admin@stancona.org
      API_ALLOWED_ORIGINS: http://keep.stancona.localhost:3004
      RESEND_API_KEY: ""

    steps:
      - name: Checkout portfolio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout grimoire
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stancona/grimoire
          ref: dev
          token: ${{ secrets.GRIMOIRE_TOKEN }}
          path: grimoire

      - name: Setup pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install portfolio dependencies
        run: npm ci

      - name: Install grimoire dependencies
        working-directory: grimoire
        run: pnpm install --frozen-lockfile

      - name: Push schema to database
        working-directory: grimoire
        run: pnpm --filter @stancona/db db:push

      - name: Seed roles
        working-directory: grimoire
        run: pnpm --filter @stancona/db db:seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start dev servers
        working-directory: grimoire
        run: |
          (cd apps/main && pnpm dev) &
          (cd apps/keep && pnpm dev) &
          (cd apps/app && pnpm dev) &
          npx wait-on http://localhost:4321/en/ http://localhost:3004/ http://localhost:3000/ -t 180000

      - name: Prepare capture database
        run: node scripts/prepare-capture-db.mjs
        env:
          GRIMOIRE_APP_DIR: ${{ github.workspace }}/grimoire/apps/app

      - name: Capture screenshots (EN)
        env:
          SHOWCASE_SESSION: ${{ env.SHOWCASE_SESSION }}
          SHOWCASE_TOKEN: ${{ env.SHOWCASE_TOKEN }}
        run: |
          node scripts/capture-design.js
          node scripts/capture-apps.js

      - name: Capture screenshots (TR)
        env:
          SHOWCASE_SESSION: ${{ env.SHOWCASE_SESSION }}
          SHOWCASE_TOKEN: ${{ env.SHOWCASE_TOKEN }}
        run: |
          LOCALE=tr OUTDIR=raw-screenshots-tr node scripts/capture-design.js
          LOCALE=tr OUTDIR=raw-screenshots-tr node scripts/capture-apps.js

      - name: Copy into screenshots/en
        run: |
          cp raw-screenshots/design-system/*.png screenshots/en/design-system/
          cp raw-screenshots/keep-pwa/*.png screenshots/en/keep-pwa/
          cp raw-screenshots/admin-panel/*.png screenshots/en/admin-panel/

      - name: Copy into screenshots/tr
        run: |
          cp raw-screenshots-tr/design-system/*.png screenshots/tr/design-system/
          cp raw-screenshots-tr/keep-pwa/*.png screenshots/tr/keep-pwa/
          cp raw-screenshots-tr/admin-panel/*.png screenshots/tr/admin-panel/

      - name: Sanitize check
        run: bash scripts/sanitize-checklist.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/en screenshots/tr
          if git diff --cached --quiet; then
            echo "No screenshot changes detected"
          else
            SOURCE_SHA="${{ github.event.client_payload.sha || github.sha }}"
            git commit -m "chore(screenshots): regenerate from grimoire@${SOURCE_SHA::7} [skip ci]"
            git push
          fi

      - name: Upload raw screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-screenshots
          path: raw-screenshots/
          retention-days: 7
